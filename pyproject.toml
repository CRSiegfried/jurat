[project]
name = "jurat"
version = "0.3.0"
description = "Gather evidence from a decision model, compile one checked plan, and record the turn so it replays; the caller runs the plan."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Christopher Siegfried", email = "160437306+CRSiegfried@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = []
keywords = ["blackboard", "decision model", "planning", "llm", "agents", "rules engine"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/CRSiegfried/jurat"
Issues = "https://github.com/CRSiegfried/jurat/issues"
Changelog = "https://github.com/CRSiegfried/jurat/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.14",
    "pyright>=1.1.400",
    "rfc8785>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["docs/tutorials/write_a_design"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["jurat"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
src = ["src", "tests", "docs/tutorials/write_a_design"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "PT",       # pytest style
    "ASYNC",    # async pitfalls
    "RUF",      # ruff-specific
]

[tool.pyright]
include = ["src", "tests", "docs/tutorials"]
extraPaths = ["src", "docs/tutorials/write_a_design"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/*.md", "/LICENSE"]
